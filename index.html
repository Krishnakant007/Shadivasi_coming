<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shaadivasi • Coming Soon</title>
  <meta name="description" content="Shaadivasi under construction / coming soon page" />
  <style>
    :root{
      --bg: #0f1226;
      --fg: #e9ecf8;
      --muted: #aab1d6;
      --accent: #7c9aff;
      --card: rgba(255,255,255,0.06);
      --glass: rgba(255,255,255,0.12);
      --shadow: 0 10px 25px rgba(0,0,0,0.35);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, sans-serif;
      color:var(--fg);
      background: radial-gradient(1200px 800px at 20% 20%, #1a1f43 0%, transparent 60%),
                  radial-gradient(1000px 700px at 80% 80%, #15204d 0%, transparent 60%),
                  var(--bg);
      display:grid;
      place-items:center;
    }

    .wrap{
      width:min(720px, 92vw);
      padding: clamp(20px, 4vw, 36px);
      background: linear-gradient(180deg, var(--card), transparent);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
      text-align:center;
    }

    .badge{
      display:inline-flex; gap:8px; align-items:center;
      padding:6px 12px; border-radius:999px;
      background: var(--glass);
      border:1px solid rgba(255,255,255,0.08);
      font-weight:600; letter-spacing:.2px; font-size:14px; color:var(--muted);
    }

    .badge .dot{width:8px; height:8px; border-radius:50%; background: var(--accent); box-shadow:0 0 12px var(--accent);}

    h1{font-size: clamp(34px, 8vw, 56px); margin:14px 0 8px; font-weight:800; text-transform:uppercase;}
    h2{font-size: clamp(24px, 5vw, 36px); margin:8px 0; font-weight:600;}
    p{margin:8px 0; color: var(--muted); font-size: clamp(14px, 2.6vw, 16px)}

    .progress{margin:22px auto 6px; height:10px; width: min(520px, 90%); background: rgba(255,255,255,0.08); border-radius:999px; overflow:hidden;}
    .bar{height:100%; width: 40%; background: linear-gradient(90deg, var(--accent), #b4c4ff); border-radius:999px; animation: load 2.3s ease-in-out infinite alternate;}
    @keyframes load{ from{ width:22% } to{ width:88% } }

    .countdown{display:flex; justify-content:center; gap:14px; margin:16px 0 8px; flex-wrap:wrap}
    .pill{min-width:78px; padding:10px 14px; border-radius:14px; background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08)}
    .pill .num{font-size:22px; font-weight:700}
    .pill .lbl{font-size:12px; color:var(--muted)}

    form{margin:18px auto 0; display:flex; gap:10px; justify-content:center; width:min(520px, 100%)}
    input[type=email]{flex:1; padding:12px 14px; border-radius:12px; border:1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color:var(--fg)}
    input::placeholder{color:#cbd2ff88}
    button{padding:12px 16px; border-radius:12px; border:1px solid rgba(255,255,255,0.18); background: var(--accent); color:#0c1024; font-weight:700; cursor:pointer}
    button:active{transform: translateY(1px)}

    .footer{margin-top:18px; font-size:12px; color:var(--muted)}
    .blink{animation: blink 1.2s steps(2, start) infinite}
    @keyframes blink{to{visibility:hidden}}

    .emoji{font-size: 40px; filter: drop-shadow(0 6px 18px rgba(124,154,255,0.35));}
  </style>
</head>
<body>
  <main class="wrap">
    <span class="badge"><span class="dot"></span> Shaadivasi</span>

    <div class="emoji" aria-hidden>🚧</div>
    <h1>Coming Soon<span class="blink">_</span></h1>
    <h2>We are Shaadivasi</h2>
    <p>Our website is under construction. We’ll be live in just 7 days!</p>

    <section class="countdown" aria-label="countdown">
      <div class="pill"><div class="num" id="d">00</div><div class="lbl">Days</div></div>
      <div class="pill"><div class="num" id="h">00</div><div class="lbl">Hours</div></div>
      <div class="pill"><div class="num" id="m">00</div><div class="lbl">Minutes</div></div>
      <div class="pill"><div class="num" id="s">00</div><div class="lbl">Seconds</div></div>
    </section>

    <div class="progress" aria-hidden>
      <div class="bar"></div>
    </div>

    <form id="notify">
      <input type="email" id="email" placeholder="Enter your email for updates" aria-label="Email" required />
      <button type="submit">Notify Me</button>
    </form>

    <p class="footer">© <span id="year"></span> Shaadivasi • All rights reserved.</p>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    document.getElementById('notify').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = /** @type {HTMLInputElement} */(document.getElementById('email')).value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        alert('Please enter a valid email address.');
        return;
      }
      alert('Thanks! We\'ll let you know when we launch.');
      this.reset();
    });

    // Countdown: 7 days from now
    const target = new Date(Date.now() + 7*24*60*60*1000);
    const countdown = document.querySelector('.countdown');

    function tick(){
      const now = new Date();
      const diff = target - now;
      if(diff <= 0){
        document.querySelector('#d').textContent = '00';
        document.querySelector('#h').textContent = '00';
        document.querySelector('#m').textContent = '00';
        document.querySelector('#s').textContent = '00';
        clearInterval(timer); return;
      }
      const s = Math.floor(diff/1000);
      const d = Math.floor(s/86400);
      const h = Math.floor((s%86400)/3600);
      const m = Math.floor((s%3600)/60);
      const sec = s%60;
      document.querySelector('#d').textContent = String(d).padStart(2,'0');
      document.querySelector('#h').textContent = String(h).padStart(2,'0');
      document.querySelector('#m').textContent = String(m).padStart(2,'0');
      document.querySelector('#s').textContent = String(sec).padStart(2,'0');
    }
    const timer = setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
